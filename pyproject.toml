[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-llm-connector"
version = "0.1.0"
description = "Клиент для YandexGPT (Foundation Models API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["connector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
